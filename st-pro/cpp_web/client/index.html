<!DOCTYPE html>
<html>
<body>
<input id="msg">
<button onclick="sendMsg()">Send</button>

<script>
const ws = new WebSocket("ws://localhost:8080");

ws.onmessage = (event) => {
    console.log("Server:", event.data);
};

function sendMsg() {
    ws.send(document.getElementById("msg").value);
}
</script>
</body>
</html>
