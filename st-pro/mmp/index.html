<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen py-12 px-4">
    <!-- Header -->
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold text-white mb-3">Utility Tools</h1>
            <p class="text-purple-200 text-lg">Encode, decode, generate passwords, and manage time effortlessly</p>
        </div>

        <!-- Tools Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- Encoder/Decoder Card -->
            <div class="bg-white/10 backdrop-blur-md rounded-xl shadow-2xl border border-white/20 p-8 hover:border-purple-400/50 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-white">Encoder/Decoder</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-purple-200 mb-2">Input Text</label>
                        <textarea class="w-full px-4 py-3 rounded-lg bg-white/5 border border-purple-300/30 text-white placeholder-purple-300/50 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition" rows="4" placeholder="Enter text to encode or decode..." id="inputText"></textarea>
                    </div>
                    
                    <div class="flex gap-3">
                        <button class="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105" id="encodeBtn">Encode</button>
                        <button class="flex-1 bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-600 hover:to-cyan-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105" id="decodeBtn">Decode</button>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-purple-200 mb-2">Output</label>
                        <div class="px-4 py-3 rounded-lg bg-white/5 border border-purple-300/30 text-purple-100 min-h-24 max-h-96 overflow-y-auto whitespace-pre-wrap break-words text-sm leading-relaxed" id="result">
                            <span class="text-purple-300">Your result will appear here</span>
                        </div>
                    </div>

                    <button class="w-full bg-white/10 hover:bg-white/20 border border-white/30 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200" id="copyBtn">Copy Result</button>
                </div>
            </div>

            <!-- Time Utils Card -->
            <div class="bg-white/10 backdrop-blur-md rounded-xl shadow-2xl border border-white/20 p-8 hover:border-green-400/50 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-lg flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-white">Time Utilities</h2>
                </div>
                
                <div class="space-y-4">
                    <div class="bg-white/5 rounded-lg p-4 border border-green-300/30">
                        <p class="text-sm text-green-200 mb-2">Current Date & Time</p>
                        <p class="text-xl font-bold text-white">2024-01-15 14:30:45</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-purple-200 mb-2">Unix Timestamp</label>
                        <input type="text" class="w-full px-4 py-2 rounded-lg bg-white/5 border border-green-300/30 text-white placeholder-purple-300/50 focus:outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition" placeholder="1705339845" readonly>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105">Now</button>
                        <button class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105">Convert</button>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-purple-200 mb-2">Time Zone Converter</label>
                        <select class="w-full px-4 py-2 rounded-lg bg-white/5 border border-green-300/30 text-white focus:outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition">
                            <option>UTC</option>
                            <option>IST (UTC+5:30)</option>
                            <option>EST (UTC-5)</option>
                            <option>PST (UTC-8)</option>
                            <option>GMT (UTC+0)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Password Generator Card -->
            <div class="bg-white/10 backdrop-blur-md rounded-xl shadow-2xl border border-white/20 p-8 hover:border-orange-400/50 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-12 h-12 bg-gradient-to-br from-orange-400 to-orange-600 rounded-lg flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-white">Password Generator</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-purple-200 mb-2">Generated Password</label>
                        <div class="flex gap-2">
                            <input type="text" class="flex-1 px-4 py-3 rounded-lg bg-white/5 border border-orange-300/30 text-white placeholder-purple-300/50 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-400/20 transition font-mono" value=" " readonly id
                            ="generatedPassword">
                            <button class="bg-white/10 hover:bg-white/20 border border-white/30 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200">Copy</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-purple-200 mb-2">Password Length</label>
                        <div class="flex items-center gap-4">
                            <input type="range" min="8" max="32" value="16" class="flex-1 h-2 bg-white/20 rounded-lg appearance-none cursor-pointer accent-orange-500" id="passwordLength">
                            <span class="text-white font-semibold bg-white/10 px-3 py-1 rounded text-sm" id="passwordLengthValue">16</span>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <label class="flex items-center text-purple-200 cursor-pointer hover:text-white transition">
                            <input type="checkbox" class="w-4 h-4 rounded bg-white/10 border-white/30 accent-orange-500 cursor-pointer" checked id="includeUppercase">
                            <span class="ml-2 text-sm">Uppercase (A-Z)</span>
                        </label>
                        <label class="flex items-center text-purple-200 cursor-pointer hover:text-white transition">
                            <input type="checkbox" class="w-4 h-4 rounded bg-white/10 border-white/30 accent-orange-500 cursor-pointer" checked id="includeLowercase">
                            <span class="ml-2 text-sm">Lowercase (a-z)</span>
                        </label>
                        <label class="flex items-center text-purple-200 cursor-pointer hover:text-white transition">
                            <input type="checkbox" class="w-4 h-4 rounded bg-white/10 border-white/30 accent-orange-500 cursor-pointer" checked id="includeNumbers">
                            <span class="ml-2 text-sm">Numbers (0-9)</span>
                        </label>
                        <label class="flex items-center text-purple-200 cursor-pointer hover:text-white transition">
                            <input type="checkbox" class="w-4 h-4 rounded bg-white/10 border-white/30 accent-orange-500 cursor-pointer" checked id="includeSpecial">
                            <span class="ml-2 text-sm">Special (!@#$%...)</span>
                        </label>
                    </div>

                    <button class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-105" id="generatePassword">Generate Password</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-12">
            <p class="text-purple-300 text-sm">All tools work locally • No data is sent anywhere</p>
        </div>
    </div>
</body>
<script type="module" src="../mmp/src/main.js"></script>
</html>
